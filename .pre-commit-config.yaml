repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6 # matches CI's pinned ruff (.github/workflows/tests.yml)
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/
