[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scads-drvi"
version = "0.1.0"
description = "DRVI factorization, S-LDSC heritability enrichment and per-cell disease scores for single-cell ATAC data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mike Cuoco", email = "mike.cuoco@alleninstitute.org" }]

# Floors DOCUMENT what the code needs; they are not an install instruction. Inside a
# mamba-solved prefix install with --no-deps so pip never re-resolves numpy/pandas.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scvi-tools>=1.5",
    "torch>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scads_drvi = ["py.typed"]

# rootdir is code/scads_drvi/, deliberately NOT the capsule root: code/tests/conftest.py
# inserts seven arm directories into sys.path, and collecting both suites in one session
# would let those inserts satisfy an import this package should satisfy itself -- a false
# green that would hide exactly the bug class this package exists to remove.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: needs a CUDA device",
    "data: needs real data on disk",
]
