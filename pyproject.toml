[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scads-drvi"
version = "0.1.0"
description = "DRVI factorization, S-LDSC heritability enrichment and per-cell disease scores for single-cell ATAC data"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mike Cuoco", email = "mike.cuoco@alleninstitute.org" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]


# Floors DOCUMENT what the code needs; they are not an install instruction. Inside a
# mamba-solved prefix install with --no-deps so pip never re-resolves numpy/pandas.
#
# numpy/pandas/python/scipy/matplotlib were raised to match scanpy's own floor
# (Requires-Python>=3.12, numpy>=2, pandas>=2.3, matplotlib>=3.10, as of scanpy
# 1.12.4 -- scipy>=1.13 is the first scipy release compatible with numpy 2, one
# transitive step further than scanpy's own declared floor) rather than pinning an
# older scanpy or keeping it optional: pl/ now wraps scanpy.pl.embedding directly for
# every embedding figure, not only the DRVI-specific ones, so scanpy is a hard
# dependency of the plotting stage the same way matplotlib/seaborn already are.
dependencies = [
    "numpy>=2",
    "pandas>=2.3",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "anndata>=0.10",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "scanpy>=1.12",
    # annotate.motif's region-overlap mapping (build_region_map). A hard dependency
    # rather than an extra: bioframe's own declared deps are matplotlib, numpy,
    # pandas, pyyaml and requests -- everything but requests is already required
    # here, so gating it behind an extra would buy nothing.
    "bioframe>=0.6",
    # annotate.motif's score-database streaming (stream_accumulate and friends).
    "pyarrow>=14",
    # enrich's S-LDSC backend: LD-score/heritability computation via mikecuoco/ldsc's
    # Rust core through its PyO3 bindings. No PyPI release -- built from source by
    # maturin, which needs a Rust >=1.85 toolchain available at install time (e.g.
    # `micromamba install rust maturin` on a cluster with no system Rust). Pinned to
    # a specific commit rather than `main`, bumped deliberately as ldsc_rs evolves.
    "ldsc-rs @ git+https://github.com/mikecuoco/ldsc.git@ee5ab73918ad8801f9cd14de73d745273fc216fd#subdirectory=python",
]

# torch/scvi-tools/drvi-py are not imported anywhere in this package (training and
# loading a DRVI model is the caller's own job, done directly against
# `scvi.external.DRVI` -- see the getting-started guide). They are an optional extra,
# not a hard dependency, so `pip install scads-drvi` stays light for callers who only
# need the enrichment/scoring/plotting stages.
[project.optional-dependencies]
test = ["pytest>=7.4"]
drvi = ["scvi-tools>=1.5", "torch>=2.4", "drvi-py>=0.2.7"]
# annotate.llm's LLM-based factor annotation (annotate_factor/annotate_factors). An
# optional extra rather than a hard dependency for the same reason as `drvi`:
# annotate.llm imports it function-locally, so the base install stays light for
# callers who never call into that one module.
llm = ["anthropic>=0.40"]
docs = [
    "sphinx>=7.3",
    "sphinx-book-theme>=1.1",
    "sphinx-autodoc-typehints>=2.2",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.1",
    "jupytext>=1.16",
]
# mypy plus stub packages for the runtime deps that don't ship py.typed themselves
# (pandas, scipy, pyarrow, pyyaml, seaborn -- numpy/anndata/matplotlib already do).
# scanpy/bioframe/h5py have no stub package on PyPI; those get an ignore_missing_imports
# override in [tool.mypy] instead.
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.3",
    "scipy-stubs>=1.13",
    "pyarrow-stubs>=17",
    "types-PyYAML>=6.0",
    "types-seaborn>=0.13",
]
[project.urls]
Homepage = "https://github.com/mikecuoco/scads_drvi"
Source = "https://github.com/mikecuoco/scads_drvi"
Issues = "https://github.com/mikecuoco/scads_drvi/issues"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scads_drvi = ["py.typed"]

# testpaths is scoped to this repo's own tests. When the package is vendored beside
# another suite -- as it is in the capsule it came from, whose conftest.py inserts seven
# directories into sys.path -- the two must be collected in separate sessions, or those
# inserts satisfy an import this package should satisfy itself: a false green hiding
# exactly the bug class this package exists to remove.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: needs a CUDA device",
    "data: needs real data on disk",
]

# Linting. The rule set is chosen for signal, not coverage: pyflakes (F) catches dead
# imports and undefined names, bugbear (B) catches the closure-over-loop-variable and
# zip-length classes, and I/UP keep imports and typing idioms current. Adopting it found
# one real closure bug and one zip that silently truncated a padded subplot grid.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__ is the public surface, so a name imported and not used locally
# is the point.
"src/scads_drvi/__init__.py" = ["F401"]
"src/scads_drvi/*/__init__.py" = ["F401"]

# Type checking. Scoped to src/ only, not tests/: pytest fixtures and parametrize
# are conventionally lightly annotated, same "signal not coverage" reasoning as the
# ruff rule selection above.
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
# This HPC's shared Python 3.13 build has no _sqlite3 extension module, which
# crashes mypy's sqlite-backed cache with an internal error; the file-based cache
# works everywhere and costs little.
sqlite_cache = false

# No stub package exists for these on PyPI; without this override strict mode fails
# on every import instead of checking real code.
[[tool.mypy.overrides]]
module = ["scanpy.*", "bioframe.*", "h5py.*"]
ignore_missing_imports = true

# anthropic backs the optional `llm` extra and is imported function-locally in
# annotate/llm.py, so it isn't installed by the `dev` extra alone.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
