[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scads-drvi"
version = "0.1.0"
description = "DRVI factorization, S-LDSC heritability enrichment and per-cell disease scores for single-cell ATAC data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mike Cuoco", email = "mike.cuoco@alleninstitute.org" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]


# Floors DOCUMENT what the code needs; they are not an install instruction. Inside a
# mamba-solved prefix install with --no-deps so pip never re-resolves numpy/pandas.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scvi-tools>=1.5",
    "torch>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
[project.urls]
Homepage = "https://github.com/mikecuoco/scads_drvi"
Source = "https://github.com/mikecuoco/scads_drvi"
Issues = "https://github.com/mikecuoco/scads_drvi/issues"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scads_drvi = ["py.typed"]

# testpaths is scoped to this repo's own tests. When the package is vendored beside
# another suite -- as it is in the capsule it came from, whose conftest.py inserts seven
# directories into sys.path -- the two must be collected in separate sessions, or those
# inserts satisfy an import this package should satisfy itself: a false green hiding
# exactly the bug class this package exists to remove.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: needs a CUDA device",
    "data: needs real data on disk",
]

# Linting. The rule set is chosen for signal, not coverage: pyflakes (F) catches dead
# imports and undefined names, bugbear (B) catches the closure-over-loop-variable and
# zip-length classes, and I/UP keep imports and typing idioms current. Adopting it found
# one real closure bug and one zip that silently truncated a padded subplot grid.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__ is the public surface, so a name imported and not used locally
# is the point.
"src/scads_drvi/__init__.py" = ["F401"]
"src/scads_drvi/*/__init__.py" = ["F401"]
