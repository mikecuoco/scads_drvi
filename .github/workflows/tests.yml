name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter turns an upstream release into a red build on a
      # commit that changed nothing.
      - run: pip install ruff==0.16.6
      - run: ruff check --output-format=github .

  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The full declared install: every hard dependency, plus the `test` extra.
      # `drvi` (torch/scvi-tools/drvi-py) stays out: nothing in this package
      # imports them -- training/loading a DRVI model is the caller's own job
      # against `scvi.external.DRVI` directly.
      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Show resolved versions
        run: python -m pip list

      - name: Run tests
        run: pytest -rs -p no:cacheprovider --color=yes
